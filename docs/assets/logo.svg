<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111119"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#f97066"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd93d"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="mint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e6cf"/>
      <stop offset="100%" style="stop-color:#6ee7b7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle ambient glow behind the graph -->
  <circle cx="256" cy="256" r="120" fill="#4ecdc4" opacity="0.04" filter="url(#softglow)"/>

  <!-- Edges (connections between nodes) -->
  <g stroke-width="2.5" fill="none" opacity="0.35">
    <!-- Central hub connections -->
    <line x1="256" y1="200" x2="160" y2="280" stroke="#4ecdc4"/>
    <line x1="256" y1="200" x2="352" y2="280" stroke="#ff6b6b"/>
    <line x1="256" y1="200" x2="256" y2="340" stroke="#ffd93d"/>
    <line x1="256" y1="200" x2="148" y2="180" stroke="#6c5ce7"/>
    <line x1="256" y1="200" x2="364" y2="180" stroke="#a8e6cf"/>
    <!-- Outer connections -->
    <line x1="160" y1="280" x2="256" y2="340" stroke="#6c5ce7"/>
    <line x1="352" y1="280" x2="256" y2="340" stroke="#a8e6cf"/>
    <line x1="148" y1="180" x2="160" y2="280" stroke="#ffd93d"/>
    <line x1="364" y1="180" x2="352" y2="280" stroke="#ff6b6b"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#glow)">
    <!-- Central node (largest) -->
    <circle cx="256" cy="200" r="18" fill="url(#teal)"/>
    <!-- Left node -->
    <circle cx="160" cy="280" r="13" fill="url(#coral)"/>
    <!-- Right node -->
    <circle cx="352" cy="280" r="13" fill="url(#gold)"/>
    <!-- Bottom node -->
    <circle cx="256" cy="340" r="11" fill="url(#purple)"/>
    <!-- Top-left node -->
    <circle cx="148" cy="180" r="9" fill="url(#mint)"/>
    <!-- Top-right node -->
    <circle cx="364" cy="180" r="9" fill="url(#teal)"/>
  </g>

  <!-- Small satellite dots for depth -->
  <circle cx="110" cy="230" r="4" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="400" cy="230" r="4" fill="#ff6b6b" opacity="0.3"/>
  <circle cx="200" cy="370" r="3.5" fill="#ffd93d" opacity="0.25"/>
  <circle cx="312" cy="370" r="3.5" fill="#6c5ce7" opacity="0.25"/>
  <circle cx="196" cy="140" r="3" fill="#a8e6cf" opacity="0.2"/>
  <circle cx="316" cy="140" r="3" fill="#ff6b6b" opacity="0.2"/>

  <!-- "V" letterform subtly implied by the two descending edges from center -->

</svg>
