<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="20%" style="stop-color:#6c5ce7"/>
      <stop offset="40%" style="stop-color:#ff6b6b"/>
      <stop offset="60%" style="stop-color:#ffd93d"/>
      <stop offset="80%" style="stop-color:#a8e6cf"/>
      <stop offset="100%" style="stop-color:#4ecdc4"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="800" height="180" fill="url(#bg)" rx="16"/>
  <ellipse cx="400" cy="90" rx="280" ry="40" fill="url(#glow)" opacity="0.08" filter="url(#blur)"/>
  <text x="400" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-2">visualise</text>
  <line x1="260" y1="105" x2="540" y2="105" stroke="url(#glow)" stroke-width="1.5" opacity="0.4"/>
  <text x="400" y="130" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif" font-size="16" fill="#666" letter-spacing="3" font-weight="400">INTERACTIVE VISUALIZATIONS ON DEMAND</text>
</svg>
