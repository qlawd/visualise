<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correlation Matrix</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 32px 16px;
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #888;
    margin-bottom: 28px;
  }

  #chart-container {
    position: relative;
    width: 100%;
    max-width: 720px;
  }

  .tooltip {
    position: fixed;
    pointer-events: none;
    background: #1a1a2e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.82rem;
    line-height: 1.5;
    color: #e0e0e0;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
  }
  .tooltip .label { color: #aaa; }
  .tooltip .value { font-weight: 700; font-size: 1rem; }

  /* Scatter overlay */
  .scatter-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  .scatter-panel {
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 28px;
    position: relative;
    max-width: 520px;
    width: 90vw;
  }
  .scatter-panel h2 {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .scatter-panel .scatter-sub {
    font-size: 0.82rem;
    color: #888;
    margin-bottom: 16px;
  }
  .scatter-close {
    position: absolute;
    top: 14px; right: 18px;
    background: none;
    border: none;
    color: #888;
    font-size: 1.4rem;
    cursor: pointer;
    line-height: 1;
  }
  .scatter-close:hover { color: #e0e0e0; }
</style>
</head>
<body>

<h1>Correlation Matrix</h1>
<p class="subtitle">Hover to compare. Click a cell for scatter plot.</p>
<div id="chart-container"></div>
<div class="tooltip" id="tooltip"></div>

<script>
// --- Data ---
const variables = [
  "Revenue", "Marketing Spend", "User Signups", "Churn Rate", "NPS Score",
  "Page Load Time", "Support Tickets", "Feature Adoption", "Team Size", "Deploy Frequency"
];
const n = variables.length;

// Build correlation matrix (symmetric, diagonal = 1)
const specified = {
  "0,1": 0.82, "0,2": 0.78, "0,3": -0.25, "0,4": 0.52, "0,5": -0.30,
  "0,6": -0.18, "0,7": 0.45, "0,8": 0.22, "0,9": 0.29,
  "1,2": 0.65, "1,3": -0.15, "1,4": 0.30, "1,5": -0.12,
  "1,6": -0.08, "1,7": 0.27, "1,8": 0.18, "1,9": 0.10,
  "2,3": -0.38, "2,4": 0.48, "2,5": -0.42, "2,6": 0.14,
  "2,7": 0.55, "2,8": 0.12, "2,9": 0.25,
  "3,4": -0.71, "3,5": 0.28, "3,6": 0.61, "3,7": -0.65,
  "3,8": -0.08, "3,9": -0.22,
  "4,5": -0.55, "4,6": -0.43, "4,7": 0.58, "4,8": 0.10, "4,9": 0.30,
  "5,6": 0.26, "5,7": -0.33, "5,8": -0.05, "5,9": -0.18,
  "6,7": -0.40, "6,8": 0.15, "6,9": -0.12,
  "7,8": 0.09, "7,9": 0.68,
  "8,9": 0.20
};

const matrix = Array.from({length: n}, () => Array(n).fill(0));
for (let i = 0; i < n; i++) {
  matrix[i][i] = 1.0;
  for (let j = i + 1; j < n; j++) {
    const key = `${i},${j}`;
    const val = specified[key] !== undefined ? specified[key] : +(Math.random() * 0.4 - 0.2).toFixed(2);
    matrix[i][j] = val;
    matrix[j][i] = val;
  }
}

// Flatten for D3
const cells = [];
for (let i = 0; i < n; i++)
  for (let j = 0; j < n; j++)
    cells.push({row: i, col: j, value: matrix[i][j]});

// --- Layout ---
const container = document.getElementById("chart-container");
const margin = {top: 120, right: 20, bottom: 80, left: 140};

function render() {
  container.innerHTML = "";
  const containerWidth = container.clientWidth;
  const size = containerWidth;
  const innerSize = size - margin.left - margin.right;
  const cellSize = innerSize / n;

  const svg = d3.select(container).append("svg")
    .attr("viewBox", `0 0 ${size} ${size + 50}`)
    .attr("width", "100%")
    .style("display", "block");

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // Scales
  const x = d3.scaleBand().domain(d3.range(n)).range([0, innerSize]).padding(0.05);
  const y = d3.scaleBand().domain(d3.range(n)).range([0, innerSize]).padding(0.05);
  const color = d3.scaleLinear()
    .domain([-1, 0, 1])
    .range(["#4361ee", "#1a1a1a", "#ef233c"]);

  // Row highlight rects (behind cells)
  const rowHighlights = g.selectAll(".row-highlight")
    .data(d3.range(n)).enter().append("rect")
    .attr("class", "row-highlight")
    .attr("x", -4).attr("y", i => y(i) - 2)
    .attr("width", innerSize + 8).attr("height", y.bandwidth() + 4)
    .attr("rx", 3)
    .attr("fill", "none");

  const colHighlights = g.selectAll(".col-highlight")
    .data(d3.range(n)).enter().append("rect")
    .attr("class", "col-highlight")
    .attr("x", j => x(j) - 2).attr("y", -4)
    .attr("width", x.bandwidth() + 4).attr("height", innerSize + 8)
    .attr("rx", 3)
    .attr("fill", "none");

  // Cells
  const cellRects = g.selectAll(".cell")
    .data(cells).enter().append("rect")
    .attr("class", "cell")
    .attr("x", d => x(d.col))
    .attr("y", d => y(d.row))
    .attr("width", x.bandwidth())
    .attr("height", y.bandwidth())
    .attr("rx", 3)
    .attr("fill", d => color(d.value))
    .attr("stroke", "none")
    .style("cursor", "pointer")
    .style("opacity", 1);

  // Cell text (r-value) for larger cells
  if (cellSize > 38) {
    g.selectAll(".cell-text")
      .data(cells).enter().append("text")
      .attr("class", "cell-text")
      .attr("x", d => x(d.col) + x.bandwidth() / 2)
      .attr("y", d => y(d.row) + y.bandwidth() / 2)
      .attr("text-anchor", "middle")
      .attr("dominant-baseline", "central")
      .attr("fill", d => Math.abs(d.value) > 0.5 ? "#fff" : "#999")
      .attr("font-size", Math.min(cellSize * 0.28, 12))
      .attr("font-weight", d => Math.abs(d.value) > 0.6 ? 600 : 400)
      .attr("pointer-events", "none")
      .text(d => d.value.toFixed(2));
  }

  // Labels - columns (top)
  g.selectAll(".col-label")
    .data(variables).enter().append("text")
    .attr("class", "col-label")
    .attr("x", (d, i) => x(i) + x.bandwidth() / 2)
    .attr("y", -10)
    .attr("text-anchor", "start")
    .attr("transform", (d, i) => `rotate(-45, ${x(i) + x.bandwidth() / 2}, -10)`)
    .attr("fill", "#bbb")
    .attr("font-size", Math.min(cellSize * 0.3, 12))
    .text(d => d);

  // Labels - rows (left)
  g.selectAll(".row-label")
    .data(variables).enter().append("text")
    .attr("class", "row-label")
    .attr("x", -10)
    .attr("y", (d, i) => y(i) + y.bandwidth() / 2)
    .attr("text-anchor", "end")
    .attr("dominant-baseline", "central")
    .attr("fill", "#bbb")
    .attr("font-size", Math.min(cellSize * 0.3, 12))
    .text(d => d);

  // Legend
  const legendWidth = Math.min(innerSize, 360);
  const legendHeight = 14;
  const legendX = margin.left + (innerSize - legendWidth) / 2;
  const legendY = margin.top + innerSize + 40;

  const defs = svg.append("defs");
  const grad = defs.append("linearGradient").attr("id", "legend-grad");
  grad.append("stop").attr("offset", "0%").attr("stop-color", "#4361ee");
  grad.append("stop").attr("offset", "50%").attr("stop-color", "#1a1a1a");
  grad.append("stop").attr("offset", "100%").attr("stop-color", "#ef233c");

  svg.append("rect")
    .attr("x", legendX).attr("y", legendY)
    .attr("width", legendWidth).attr("height", legendHeight)
    .attr("rx", 4)
    .attr("fill", "url(#legend-grad)");

  const legendScale = d3.scaleLinear().domain([-1, 1]).range([legendX, legendX + legendWidth]);
  const legendAxis = d3.axisBottom(legendScale).ticks(5).tickFormat(d3.format(".1f"));
  svg.append("g")
    .attr("transform", `translate(0, ${legendY + legendHeight})`)
    .call(legendAxis)
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll("line").attr("stroke", "#555"))
    .call(g => g.selectAll("text").attr("fill", "#888").attr("font-size", 10));

  // Tooltip
  const tooltip = d3.select("#tooltip");

  cellRects
    .on("mouseenter", function(event, d) {
      // Highlight row + col
      rowHighlights.attr("fill", (_, i) => i === d.row ? "rgba(255,255,255,0.04)" : "none");
      colHighlights.attr("fill", (_, j) => j === d.col ? "rgba(255,255,255,0.04)" : "none");

      cellRects.style("opacity", c =>
        (c.row === d.row || c.col === d.col) ? 1 : 0.35
      );

      const sign = d.value > 0 ? "+" : "";
      tooltip.html(
        `<span class="label">${variables[d.row]}</span> <span style="color:#555">&times;</span> <span class="label">${variables[d.col]}</span><br>` +
        `<span class="value" style="color:${color(d.value)}">r = ${sign}${d.value.toFixed(2)}</span>`
      ).style("opacity", 1);
    })
    .on("mousemove", function(event) {
      const tx = event.clientX + 16;
      const ty = event.clientY - 10;
      tooltip.style("left", tx + "px").style("top", ty + "px");
    })
    .on("mouseleave", function() {
      rowHighlights.attr("fill", "none");
      colHighlights.attr("fill", "none");
      cellRects.style("opacity", 1);
      tooltip.style("opacity", 0);
    })
    .on("click", function(event, d) {
      showScatter(d.row, d.col, d.value);
    });
}

// --- Scatter plot overlay ---
function generateCorrelatedPoints(r, count) {
  // Box-Muller + Cholesky for correlated normals
  const pts = [];
  for (let i = 0; i < count; i++) {
    const u1 = Math.random(), u2 = Math.random();
    const z0 = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
    const z1 = Math.sqrt(-2 * Math.log(u1)) * Math.sin(2 * Math.PI * u2);
    const x = z0;
    const y = r * z0 + Math.sqrt(1 - r * r) * z1;
    pts.push([x, y]);
  }
  return pts;
}

function showScatter(ri, ci, rVal) {
  // Remove existing
  d3.select(".scatter-overlay").remove();

  const overlay = d3.select("body").append("div").attr("class", "scatter-overlay");
  overlay.on("click", function(e) {
    if (e.target === this) overlay.remove();
  });

  const panel = overlay.append("div").attr("class", "scatter-panel");
  panel.append("h2").text(`${variables[ri]}  vs  ${variables[ci]}`);
  panel.append("div").attr("class", "scatter-sub").text(`Pearson r = ${rVal >= 0 ? "+" : ""}${rVal.toFixed(2)}`);
  panel.append("button").attr("class", "scatter-close").html("&times;").on("click", () => overlay.remove());

  const w = 420, h = 360;
  const sm = {top: 20, right: 20, bottom: 40, left: 44};
  const pts = generateCorrelatedPoints(rVal, 50);

  const xExtent = d3.extent(pts, d => d[0]);
  const yExtent = d3.extent(pts, d => d[1]);
  const pad = 0.3;

  const sx = d3.scaleLinear().domain([xExtent[0] - pad, xExtent[1] + pad]).range([sm.left, w - sm.right]);
  const sy = d3.scaleLinear().domain([yExtent[0] - pad, yExtent[1] + pad]).range([h - sm.bottom, sm.top]);

  const svg = panel.append("svg")
    .attr("viewBox", `0 0 ${w} ${h}`)
    .attr("width", "100%")
    .style("display", "block");

  // Grid lines
  svg.append("g").attr("transform", `translate(0,${h - sm.bottom})`)
    .call(d3.axisBottom(sx).ticks(5))
    .call(g => g.select(".domain").attr("stroke", "#333"))
    .call(g => g.selectAll("line").attr("stroke", "#222"))
    .call(g => g.selectAll("text").attr("fill", "#777").attr("font-size", 10));

  svg.append("g").attr("transform", `translate(${sm.left},0)`)
    .call(d3.axisLeft(sy).ticks(5))
    .call(g => g.select(".domain").attr("stroke", "#333"))
    .call(g => g.selectAll("line").attr("stroke", "#222"))
    .call(g => g.selectAll("text").attr("fill", "#777").attr("font-size", 10));

  // Axis labels
  svg.append("text")
    .attr("x", (sm.left + w - sm.right) / 2).attr("y", h - 4)
    .attr("text-anchor", "middle").attr("fill", "#888").attr("font-size", 11)
    .text(variables[ci]);

  svg.append("text")
    .attr("transform", `rotate(-90)`)
    .attr("x", -(sm.top + h - sm.bottom) / 2).attr("y", 13)
    .attr("text-anchor", "middle").attr("fill", "#888").attr("font-size", 11)
    .text(variables[ri]);

  // Trend line (least squares)
  const meanX = d3.mean(pts, d => d[0]);
  const meanY = d3.mean(pts, d => d[1]);
  let num = 0, den = 0;
  pts.forEach(p => { num += (p[0] - meanX) * (p[1] - meanY); den += (p[0] - meanX) ** 2; });
  const slope = den ? num / den : 0;
  const intercept = meanY - slope * meanX;
  const lx0 = xExtent[0] - pad, lx1 = xExtent[1] + pad;

  svg.append("line")
    .attr("x1", sx(lx0)).attr("y1", sy(slope * lx0 + intercept))
    .attr("x2", sx(lx1)).attr("y2", sy(slope * lx1 + intercept))
    .attr("stroke", rVal >= 0 ? "#ef233c" : "#4361ee")
    .attr("stroke-width", 2)
    .attr("stroke-dasharray", "6,4")
    .attr("opacity", 0.7);

  // Points with entrance animation
  const color = d3.scaleLinear().domain([-1, 0, 1]).range(["#4361ee", "#888", "#ef233c"]);
  svg.selectAll("circle")
    .data(pts).enter().append("circle")
    .attr("cx", d => sx(d[0]))
    .attr("cy", d => sy(d[1]))
    .attr("r", 0)
    .attr("fill", color(rVal))
    .attr("opacity", 0.8)
    .attr("stroke", "#000")
    .attr("stroke-width", 0.5)
    .transition().duration(400).delay((d, i) => i * 12)
    .attr("r", 5);

  // Escape to close
  function onKey(e) { if (e.key === "Escape") { overlay.remove(); document.removeEventListener("keydown", onKey); } }
  document.addEventListener("keydown", onKey);
}

// Initial render + responsive
render();
window.addEventListener("resize", render);
</script>
</body>
</html>
